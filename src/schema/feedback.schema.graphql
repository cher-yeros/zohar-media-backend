# import '../generated/schema.graphql'

input CreateFeedbackInput {
  name: String!
  email: String!
  phone: String!
  subject: String!
  message: String!
}

type Query {
  feedbacks: [Feedback!]!
}

type Mutation {
  createFeedback(input: CreateFeedbackInput): Feedback
}

