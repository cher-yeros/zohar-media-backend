# import '../generated/schema.graphql'

input CreateFAQInput {
  question: String!
  answer: String!
}

input UpdateFAQInput {
  id: Int!
  question: String
  answer: String
}

type Query {
  faq(id: ID!): FAQ
  allFAQs: [FAQ]
  allFAQsForUsers: [FAQ]
}

type Mutation {
  createFAQ(input: CreateFAQInput): FAQ
  updateFAQ(id: ID!, input: UpdateFAQInput): FAQ
  deleteFAQ(id: ID!): String
}
