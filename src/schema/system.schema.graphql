type SystemSettings {
  id: ID!
  business_name: String!
  business_description: String
  industry: String
  website_url: String
  contact_email: String
  theme: Theme!
  created_at: Date!
  updated_at: Date!
}

type ActivityLog {
  id: ID!
  user_id: ID
  action: String!
  entity_type: String!
  entity_id: ID
  description: String
  metadata: JSON
  created_at: Date!
  user: User
}

enum Theme {
  LIGHT
  DARK
}

type ActivityLogsResponse {
  items: [ActivityLog!]!
  total: Int!
}

type SystemSettingsResponse {
  success: Boolean!
  message: String!
  settings: SystemSettings
}

type ActivityLogResponse {
  success: Boolean!
  message: String!
  activityLog: ActivityLog
}

extend type Query {
  systemSettings: SystemSettings
  activityLogs(
    user_id: ID
    entity_type: String
    limit: Int
    offset: Int
  ): ActivityLogsResponse!
}

extend type Mutation {
  updateSystemSettings(
    business_name: String
    business_description: String
    industry: String
    website_url: String
    contact_email: String
    theme: Theme
  ): SystemSettingsResponse!

  createActivityLog(
    action: String!
    entity_type: String!
    entity_id: ID
    description: String
    metadata: JSON
  ): ActivityLogResponse!
}
