scalar Date
scalar JSON

type Query {
  _: Boolean
}

type Mutation {
  _: Boolean
}

type User {
  id: ID!
  email: String!
  first_name: String!
  last_name: String!
  role: UserRole!
  avatar_url: String
  is_active: Boolean!
  last_login_at: Date
  created_at: Date!
  updated_at: Date!
  activity_logs: [ActivityLog!]
}

enum UserRole {
  ADMIN
  MANAGER
  EDITOR
}

type UserResponse {
  success: Boolean!
  message: String!
  user: User
}

type LoginResponse {
  success: Boolean!
  message: String!
  token: String
  user: User
}

extend type Query {
  users: [User!]!
  user(id: ID!): User
}

extend type Mutation {
  createUser(
    email: String!
    password: String!
    first_name: String!
    last_name: String!
    role: UserRole
    avatar_url: String
  ): UserResponse!

  updateUser(
    id: ID!
    email: String
    first_name: String
    last_name: String
    role: UserRole
    avatar_url: String
    is_active: Boolean
  ): UserResponse!

  deleteUser(id: ID!): UserResponse!

  loginUser(email: String!, password: String!): LoginResponse!
}
