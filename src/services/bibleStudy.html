<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional //EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:v="urn:schemas-microsoft-com:vml"
  xmlns:o="urn:schemas-microsoft-com:office:office"
>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="x-apple-disable-message-reformatting" />
    <!--[if !mso]><!-->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!--<![endif]-->

    <!-- Your title goes here -->
    <title>Newsletter</title>
    <!-- End title -->

    <!-- Start stylesheet -->
    <style type="text/css">
      a,
      a[href],
      a:hover,
      a:link,
      a:visited {
        /* This is the link colour */
        text-decoration: none !important;
        color: #0000ee;
      }
      .link {
        text-decoration: underline !important;
      }
      p,
      p:visited {
        /* Fallback paragraph style */
        font-size: 15px;
        line-height: 24px;
        font-family: "Helvetica", Arial, sans-serif;
        font-weight: 300;
        text-decoration: none;
        color: #000000;
      }
      h1 {
        /* Fallback heading style */
        font-size: 22px;
        line-height: 24px;
        font-family: "Helvetica", Arial, sans-serif;
        font-weight: normal;
        text-decoration: none;
        color: #000000;
      }
      .ExternalClass p,
      .ExternalClass span,
      .ExternalClass font,
      .ExternalClass td {
        line-height: 100%;
      }
      .ExternalClass {
        width: 100%;
      }
    </style>
    <!-- End stylesheet -->
  </head>

  <!-- You can change background colour here -->

  <script>
    Handlebars.registerHelper("link", function (text, url) {
      var url = Handlebars.escapeExpression(url),
        text = Handlebars.escapeExpression(text);

      return new Handlebars.SafeString(
        "<a href='" + url + "'>" + text + "</a>"
      );
    });
  </script>

  <body
    style="
      text-align: center;
      margin: 0;
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 0;
      padding-right: 0;
      -webkit-text-size-adjust: 100%;
      background-color: #f2f4f6;
      color: #000000;
    "
    align="center"
  >
    <!-- Fallback force center content -->
    <div style="text-align: center; margin-top: 7rem">
      <table
        align="center"
        style="
          text-align: center;
          vertical-align: top;
          width: 600px;
          max-width: 600px;
          background-color: #ffffff;
        "
        width="600"
      >
        <tbody>
          <tr>
            <td
              style="
                width: 596px;
                vertical-align: top;
                padding-left: 0;
                padding-right: 0;
                padding-top: 15px;
                padding-bottom: 15px;
              "
              width="596"
            >
              <!-- Your logo is here -->
              <img
                style="
                  width: 140px;
                  max-width: 180px;
                  height: auto;
                  /* max-height: 85px; */
                  text-align: center;
                  color: #ffffff;
                "
                alt="Logo"
                src="https://res.cloudinary.com/di1hpum4d/image/upload/v1721165629/noexaykwjonxa1ltwgnw.png"
                align="center"
                width="180"
                height="85"
              />
            </td>
          </tr>
        </tbody>
      </table>
      <!-- End container for logo -->

      <!-- Start single column section -->
      <table
        align="center"
        style="
          text-align: center;
          vertical-align: top;
          width: 600px;
          max-width: 600px;
          background-color: #ffffff;
        "
        width="600"
      >
        <tbody>
          <tr>
            <td
              style="
                width: 596px;
                vertical-align: top;
                padding-left: 30px;
                padding-right: 30px;
                padding-top: 30px;
                padding-bottom: 20px;
              "
              width="596"
            >
              <h1
                style="
                  font-size: 50px;
                  line-height: 24px;
                  font-family: &quot;Helvetica&quot;, Arial, sans-serif;
                  font-weight: 600;
                  text-decoration: none;
                  color: #875e31;
                "
              >
                JPS TV
              </h1>
              <h1
                style="
                  font-size: 25x;
                  line-height: 24px;
                  font-family: &quot;Helvetica&quot;, Arial, sans-serif;
                  font-weight: 600;
                  text-decoration: none;
                  color: #000000;
                "
              >
                {{title}}
              </h1>

              <p
                style="
                  font-size: 15px;
                  line-height: 24px;
                  font-family: &quot;Helvetica&quot;, Arial, sans-serif;
                  font-weight: 400;
                  text-decoration: none;
                  color: #919293;
                "
              >
                Dear <b>{{fullname}}</b> <br />

                {{content}}

                <br />
                <br />

                Zoom Link : {{zoom_link}} <br />
                Zoom ID : {{zoom_id}} <br />
                Zoom Passcode : {{zoom_passcode}}
              </p>

              <!-- Start button (You can change the background colour by the hex code below) -->

              <!-- <a href="{{link}}"></a> -->
              <a
                href="{{zoom_link}}"
                target="_blank"
                style="
                  background-color: #000000;
                  font-size: 15px;
                  line-height: 22px;
                  font-family: &quot;Helvetica&quot;, Arial, sans-serif;
                  font-weight: normal;
                  text-decoration: none;
                  padding: 12px 15px;
                  color: #ffffff;
                  border-radius: 5px;
                  display: inline-block;
                  mso-padding-alt: 0;
                "
              >
                <span style="mso-text-raise: 15pt; color: #ffffff"
                  >{{linkName}}</span
                >
              </a>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- End footer -->

      <!-- Start unsubscribe section -->
      <table
        align="center"
        style="
          text-align: center;
          vertical-align: top;
          width: 600px;
          max-width: 600px;
        "
        width="600"
      >
        <tbody>
          <tr>
            <td
              style="
                width: 596px;
                vertical-align: top;
                padding-left: 30px;
                padding-right: 30px;
                padding-top: 30px;
                padding-bottom: 30px;
              "
              width="596"
            >
              <p
                style="
                  font-size: 12px;
                  line-height: 12px;
                  font-family: &quot;Helvetica&quot;, Arial, sans-serif;
                  font-weight: normal;
                  text-decoration: none;
                  color: #000000;
                "
              >
                JPS TV
              </p>

              <p
                style="
                  font-size: 12px;
                  line-height: 12px;
                  font-family: &quot;Helvetica&quot;, Arial, sans-serif;
                  font-weight: normal;
                  text-decoration: none;
                  color: #000000;
                "
              >
                Prophet Henok Girma
                <!-- <a
                  style="text-decoration: underline; color: #000000"
                  href="insert-unsubscribe-link-here"
                  ><u>unsubscribe here</u></a -->
                <!-- > -->
              </p>

              <p
                style="
                  font-size: 12px;
                  line-height: 12px;
                  font-family: &quot;Helvetica&quot;, Arial, sans-serif;
                  font-weight: normal;
                  text-decoration: none;
                  color: #919293;
                  margin-top: 30px;
                "
              >
                <!-- Email template built by
                <a
                  style="text-decoration: none; color: #919293"
                  href="https://fullsphere.co.uk"
                  ><u>FullSphere</u></a
                > -->
              </p>
            </td>
          </tr>
        </tbody>
      </table>
      <!-- End unsubscribe section -->
    </div>
  </body>
</html>
