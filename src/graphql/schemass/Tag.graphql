
type Tag {
  id: Int
  title: String
  createdAt: String
  updatedAt: String
}

input CreateTagInput {
  title: String!
}

input UpdateTagInput {
  id: Int!
  title: String
}

type Query {
  tag(id: ID!): Tag
  allTags: [Tag]
}

type Mutation {
  createTag(input: CreateTagInput): Tag
  updateTag(id: ID!, input: UpdateTagInput): Tag
  deleteTag(id: ID!): String
}
