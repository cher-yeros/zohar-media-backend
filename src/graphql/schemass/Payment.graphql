
type Payment {
  id: Int
  first_name: String
  last_name: String
  full_name: String
  phone: String
  email: String
  payment_method: String
  reason: String
  amount: Float
  status: String
  tx_ref: String
  createdAt: String
  updatedAt: String
  user_id: Int
}

input CreatePaymentInput {
  first_name: String!
  last_name: String!
  full_name: String!
  phone: String!
  email: String!
  payment_method: String!
  reason: String!
  amount: Float!
  status: String!
  tx_ref: String!
  user_id: Int
}

input UpdatePaymentInput {
  id: Int!
  first_name: String
  last_name: String
  full_name: String
  phone: String
  email: String
  payment_method: String
  reason: String
  amount: Float
  status: String
  tx_ref: String
  user_id: Int
}

type Query {
  payment(id: ID!): Payment
  allPayments: [Payment]
}

type Mutation {
  createPayment(input: CreatePaymentInput): Payment
  updatePayment(id: ID!, input: UpdatePaymentInput): Payment
  deletePayment(id: ID!): String
}
