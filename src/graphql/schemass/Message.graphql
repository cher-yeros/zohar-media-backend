
type Message {
  id: Int
  content: String
  seen: Boolean
  sender_id: Int
  receiver_id: Int
  createdAt: String
  updatedAt: String
}

input CreateMessageInput {
  content: String!
  seen: Boolean
  sender_id: Int!
  receiver_id: Int!
}

input UpdateMessageInput {
  id: Int!
  content: String
  seen: Boolean
  sender_id: Int
  receiver_id: Int
}

type Query {
  message(id: ID!): Message
  allMessages: [Message]
}

type Mutation {
  createMessage(input: CreateMessageInput): Message
  updateMessage(id: ID!, input: UpdateMessageInput): Message
  deleteMessage(id: ID!): String
}
