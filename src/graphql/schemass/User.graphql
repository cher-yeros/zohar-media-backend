
type User {
  id: Int
  avatar: String
  first_name: String
  role: String
  last_name: String
  full_name: String
  gender: String
  password: String
  phone: String
  email: String
  address: String
  dob: String
  is_verified: Boolean
  banned: Boolean
  resetToken: String
  resetTokenExpires: String
  createdAt: String
  updatedAt: String
}

input CreateUserInput {
  avatar: String
  first_name: String!
  role: String!
  last_name: String!
  full_name: String!
  gender: String
  password: String!
  phone: String
  email: String!
  address: String
  dob: String
  is_verified: Boolean!
  banned: Boolean!
  resetToken: String
  resetTokenExpires: String
}

input UpdateUserInput {
  id: Int!
  avatar: String
  first_name: String
  role: String
  last_name: String
  full_name: String
  gender: String
  password: String
  phone: String
  email: String
  address: String
  dob: String
  is_verified: Boolean
  banned: Boolean
  resetToken: String
  resetTokenExpires: String
}

type Query {
  user(id: ID!): User
  allUsers: [User]
}

type Mutation {
  createUser(input: CreateUserInput): User
  updateUser(id: ID!, input: UpdateUserInput): User
  deleteUser(id: ID!): String
}
