
scalar Date
scalar JSON

type Query {
  _ : Boolean
}

type Mutation {
  _ : Boolean
}

type Subscription {
  _ : Boolean
}

type ActivityLog {
  id: ID!
  action: String!
  entity_type: String!
  entity_id: ID
  description: String
  metadata: JSON
  createdAt: Date!
  updatedAt: Date!
  user: User  
}

type AnalyticsData {
  id: ID!
  date: Date!
  visitors_today: Int!
  visitors_this_week: Int!
  visitors_this_month: Int!
  visitor_trend: Float!
  inquiries_total: Int!
  inquiries_this_month: Int!
  inquiry_trend: Float!
  media_total_views: Int!
  createdAt: Date!
  updatedAt: Date!
}

type BusinessStatistics {
  id: ID!
  completed_projects: Int!
  happy_clients: Int!
  perspective_clients: Int!
  total_revenue: Float!
  average_project_value: Float!
  is_public: Boolean!
  auto_update: Boolean!
  createdAt: Date!
  updatedAt: Date!
}

type Inquiry {
  id: ID!
  name: String!
  email: String!
  subject: String!
  message: String!
  inquiry_date: Date!
  status: String!
  type: String!
  response: String
  response_date: Date
  createdAt: Date!
  updatedAt: Date!
  assigned_team_member: TeamMember  
}

type MediaItem {
  id: ID!
  title: String!
  type: String!
  url: String!
  thumbnail_url: String
  file_size: String
  dimensions: String
  duration: String
  upload_date: Date!
  createdAt: Date!
  updatedAt: Date!
  tags: [MediaItemTag!]!
}

type MediaItemTag {
  id: ID!
  tag_name: String!
  createdAt: Date!
  updatedAt: Date!
  media_item: MediaItem ! 
}

type PortfolioCategory {
  id: ID!
  name: String!
  description: String
  color: String!
  createdAt: Date!
  updatedAt: Date!
  portfolio_items: [PortfolioItem!]!
}

type PortfolioItem {
  id: ID!
  title: String!
  description: String!
  thumbnail_url: String
  client_name: String
  project_date: Date!
  status: String!
  featured: Boolean!
  project_url: String
  testimonial: String
  createdAt: Date!
  updatedAt: Date!
  category: PortfolioCategory  
  images: [PortfolioItemImage!]!
  tags: [PortfolioItemTag!]!
  technologies: [PortfolioItemTechnology!]!
  team_members: [PortfolioItemTeamMember!]!
  testimonials: [Testimonial!]!
}

type PortfolioItemImage {
  id: ID!
  image_url: String!
  alt_text: String
  sort_order: Int!
  createdAt: Date!
  updatedAt: Date!
  portfolio_item: PortfolioItem ! 
}

type PortfolioItemTag {
  id: ID!
  tag_name: String!
  createdAt: Date!
  updatedAt: Date!
  portfolio_item: PortfolioItem ! 
}

type PortfolioItemTeamMember {
  id: ID!
  role: String
  createdAt: Date!
  updatedAt: Date!
  portfolio_item: PortfolioItem ! 
  team_member: TeamMember ! 
}

type PortfolioItemTechnology {
  id: ID!
  technology_name: String!
  createdAt: Date!
  updatedAt: Date!
  portfolio_item: PortfolioItem ! 
}

type SystemSettings {
  id: ID!
  business_name: String!
  business_description: String
  industry: String
  website_url: String
  contact_email: String
  theme: String!
  createdAt: Date!
  updatedAt: Date!
}

type TeamMember {
  id: ID!
  name: String!
  role: String!
  email: String!
  phone: String
  avatar_url: String
  bio: String
  join_date: Date!
  status: String!
  createdAt: Date!
  updatedAt: Date!
  skills: [TeamMemberSkill!]!
  social_links: [TeamMemberSocialLink!]!
  portfolio_items: [PortfolioItemTeamMember!]!
  assigned_inquiries: [Inquiry!]!
}

type TeamMemberSkill {
  id: ID!
  skill_name: String!
  createdAt: Date!
  updatedAt: Date!
  team_member: TeamMember ! 
}

type TeamMemberSocialLink {
  id: ID!
  platform: String!
  url: String!
  createdAt: Date!
  updatedAt: Date!
  team_member: TeamMember ! 
}

type Testimonial {
  id: ID!
  name: String!
  company: String
  message: String!
  rating: Int
  testimonial_date: Date!
  status: String!
  featured: Boolean!
  avatar_url: String
  createdAt: Date!
  updatedAt: Date!
  portfolio_item: PortfolioItem  
}

type User {
  id: ID!
  email: String!
  password_hash: String!
  first_name: String!
  last_name: String!
  role: String!
  avatar_url: String
  is_active: Boolean!
  last_login_at: Date
  createdAt: Date!
  updatedAt: Date!
  activity_logs: [ActivityLog!]!
}
